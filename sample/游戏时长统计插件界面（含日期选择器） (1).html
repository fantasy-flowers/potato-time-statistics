<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏时长统计</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root {
  --bg-primary: #1b2838;
  --bg-secondary: #16202d;
  --bg-card: #1f2d3d;
  --bg-hover: #2a475e;
  --border: #3c4d5e;
  --text-primary: #c7d5e0;
  --text-secondary: #8f98a0;
  --text-muted: #6b7a8c;
  --accent: #66c0f4;
  --accent-bright: #1a9fff;
  --accent-dark: #0d6fb8;
  --success: #5cb85c;
  --danger: #d9534f;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
}

/* ===== 头部 ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 16px;
}

.header-title h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}

.header-title p {
  font-size: 13px;
  color: var(--text-secondary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* ===== 日期选择器 ===== */
.date-picker {
  position: relative;
}

.date-picker-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}

.date-picker-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.date-picker-btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.date-picker-btn .chevron {
  width: 10px;
  height: 10px;
  opacity: 0.6;
}

/* 弹出面板通用 */
.picker-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 100;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  display: none;
  min-width: 280px;
}

.picker-panel.open {
  display: block;
}

/* 日历面板 */
.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.cal-nav-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.cal-nav-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.cal-nav-btn svg {
  width: 14px;
  height: 14px;
}

.cal-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 6px;
}

.cal-weekday {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px 0;
}

.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--text-secondary);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}

.cal-day:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.cal-day.other-month {
  color: var(--text-muted);
  opacity: 0.4;
}

.cal-day.today {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

.cal-day.selected {
  background: var(--accent-bright);
  color: #ffffff;
  font-weight: 600;
}

.cal-day.disabled {
  color: var(--text-muted);
  opacity: 0.3;
  cursor: not-allowed;
}

.cal-day.disabled:hover {
  background: transparent;
  color: var(--text-muted);
}

/* 周维度：整周高亮 */
.cal-day.in-hover-week {
  background: rgba(102, 192, 244, 0.12);
}

.cal-day.in-selected-week {
  background: rgba(26, 159, 255, 0.25);
  color: var(--accent);
}

.cal-day.in-selected-week.selected {
  background: var(--accent-bright);
  color: #ffffff;
}

.cal-footer {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  text-align: center;
}

.cal-today-btn {
  padding: 5px 16px;
  font-size: 12px;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.cal-today-btn:hover {
  background: var(--accent);
  color: #ffffff;
}

/* 月份选择面板 */
.month-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.month-item {
  padding: 12px 8px;
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
  background: var(--bg-card);
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.month-item:hover {
  border-color: var(--accent);
  color: var(--text-primary);
}

.month-item.selected {
  background: var(--accent-bright);
  color: #ffffff;
  font-weight: 600;
}

.month-item.current {
  border-color: var(--accent);
  color: var(--accent);
}

.month-item.disabled {
  color: var(--text-muted);
  opacity: 0.35;
  cursor: not-allowed;
}

.month-item.disabled:hover {
  border-color: transparent;
  color: var(--text-muted);
}

/* ===== 维度tab ===== */
.period-tabs {
  display: flex;
  background: var(--bg-secondary);
  border-radius: 6px;
  padding: 4px;
  border: 1px solid var(--border);
}

.period-tab {
  padding: 8px 22px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.period-tab:hover { color: var(--text-primary); }

.period-tab.active {
  background: var(--accent-bright);
  color: #ffffff;
}

/* ===== 概览指标条 ===== */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  transition: border-color 0.2s;
}

.stat-card:hover { border-color: var(--accent); }

.stat-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.stat-value .unit {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-left: 4px;
}

.stat-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
}

/* ===== 主内容区 ===== */
.main-content {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 20px;
  align-items: start;
}

.chart-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  height: 480px;
  display: flex;
  flex-direction: column;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
}

.card-hint {
  font-size: 12px;
  color: var(--text-muted);
}

#mainChart {
  width: 100%;
  flex: 1;
  min-height: 0;
}

/* ===== 右侧卡片 ===== */
.side-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 480px;
}

.side-header {
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--border);
}

.side-header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.side-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

/* ===== 排序按钮 ===== */
.sort-toggle {
  display: flex;
  gap: 4px;
}

.sort-btn {
  padding: 5px 14px;
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.sort-btn:hover {
  color: var(--text-primary);
  border-color: var(--accent);
}

.sort-btn.active {
  background: var(--accent-bright);
  color: #ffffff;
  border-color: var(--accent-bright);
}

/* ===== 筛选状态 ===== */
.filter-status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--accent);
}

.filter-status .clear-filter {
  color: var(--text-muted);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.filter-status .clear-filter:hover { color: var(--text-primary); }

/* ===== 游戏排行列表 ===== */
.rank-list {
  flex: 1;
  overflow-y: auto;
  max-height: 440px;
  padding: 6px 0;
}

.rank-list::-webkit-scrollbar { width: 6px; }
.rank-list::-webkit-scrollbar-track { background: var(--bg-secondary); }
.rank-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.rank-list::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.rank-item {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  gap: 12px;
  transition: background 0.15s;
}

.rank-item:hover { background: var(--bg-hover); }

.rank-num {
  width: 22px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  text-align: center;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.rank-num.top-3 { color: var(--accent); }

.game-icon {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  flex-shrink: 0;
  letter-spacing: 0.5px;
}

.game-info {
  flex: 1;
  min-width: 0;
}

.game-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 3px;
}

.game-time {
  font-size: 12px;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}

.game-percent {
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.game-bar-wrap {
  width: 56px;
  height: 4px;
  background: var(--bg-secondary);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}

.game-bar {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* ===== 日维度趋势面板 ===== */
.trend-panel {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.back-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.back-btn svg {
  width: 12px;
  height: 12px;
}

#miniChart {
  width: 100%;
  height: 130px;
  padding: 0 20px;
  margin-top: 12px;
}

.trend-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
}

.summary-item .summary-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.summary-item .summary-value {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}

.trend-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
  max-height: 210px;
  scroll-behavior: smooth;
}

.trend-list::-webkit-scrollbar { width: 6px; }
.trend-list::-webkit-scrollbar-track { background: var(--bg-secondary); }
.trend-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.trend-row {
  display: flex;
  align-items: center;
  padding: 9px 20px;
  gap: 12px;
  transition: background 0.15s;
}

.trend-row:hover { background: var(--bg-hover); }

.trend-row.today {
  background: rgba(102, 192, 244, 0.06);
}

.trend-date {
  width: 72px;
  font-size: 13px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.trend-date .weekday {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 4px;
}

.trend-bar-wrap {
  flex: 1;
  height: 6px;
  background: var(--bg-secondary);
  border-radius: 3px;
  overflow: hidden;
}

.trend-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s ease;
}

.trend-time {
  width: 60px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  text-align: right;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.trend-delta {
  width: 48px;
  font-size: 11px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.trend-delta.up { color: var(--success); }
.trend-delta.down { color: var(--danger); }
.trend-delta.flat { color: var(--text-muted); }

.empty-state {
  padding: 48px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* ===== 响应式 ===== */
@media (max-width: 1024px) {
  .main-content { grid-template-columns: 1fr; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .rank-list { max-height: 360px; }
  .chart-card, .side-card { height: auto; }
  #mainChart { height: 320px; }
}

@media (max-width: 600px) {
  .container { padding: 16px; }
  .stats-bar { grid-template-columns: 1fr; }
  .header { flex-direction: column; align-items: flex-start; }
  .header-right { width: 100%; }
  .date-picker { flex: 1; }
  .date-picker-btn { width: 100%; justify-content: center; }
  .stat-value { font-size: 22px; }
  .header-title h1 { font-size: 20px; }
  #mainChart { height: 280px; }
  .trend-summary { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="container">

  <!-- ===== 头部 ===== -->
  <div class="header">
    <div class="header-title">
      <h1>游戏时长统计</h1>
      <p>追踪你的游戏习惯，合理安排游戏时间</p>
    </div>
    <div class="header-right">
      <!-- 日期选择器 -->
      <div class="date-picker" id="datePicker">
        <button class="date-picker-btn" id="datePickerBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="datePickerText">2026年9月3日</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="picker-panel" id="pickerPanel"></div>
      </div>
      <!-- 维度切换 -->
      <div class="period-tabs" role="tablist">
        <button class="period-tab active" data-period="day" role="tab">日</button>
        <button class="period-tab" data-period="week" role="tab">周</button>
        <button class="period-tab" data-period="month" role="tab">月</button>
      </div>
    </div>
  </div>

  <!-- ===== 概览指标条 ===== -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">总游玩时长</div>
      <div class="stat-value" id="totalTime">--<span class="unit">小时</span></div>
      <div class="stat-sub" id="totalTimeSub">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">游玩游戏数</div>
      <div class="stat-value" id="gameCount">--<span class="unit">款</span></div>
      <div class="stat-sub" id="gameCountSub">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">最常玩游戏</div>
      <div class="stat-value" id="topGame" style="font-size:18px;">--</div>
      <div class="stat-sub" id="topGameTime">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">平均时长</div>
      <div class="stat-value" id="avgTime">--<span class="unit">小时</span></div>
      <div class="stat-sub" id="avgTimeSub">--</div>
    </div>
  </div>

  <!-- ===== 主内容 ===== -->
  <div class="main-content">
    <div class="chart-card">
      <div class="card-header">
        <div class="card-title" id="mainChartTitle">时长分布</div>
        <div class="card-hint" id="mainChartHint">点击柱形可筛选对应时段的游戏排行</div>
      </div>
      <div id="mainChart"></div>
    </div>
    <div class="side-card">
      <div class="side-header" id="sideHeader"></div>
      <div class="side-body" id="sideBody"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  游戏定义
// ============================================================
var games = [
  { id: 1,  name: '艾尔登法环',            short: 'ER', color: '#c8a24e' },
  { id: 2,  name: '赛博朋克2077',          short: 'CP', color: '#f0d84c' },
  { id: 3,  name: '巫师3：狂猎',            short: 'W3', color: '#7a9cbf' },
  { id: 4,  name: 'Counter-Strike 2',      short: 'CS', color: '#d97b3c' },
  { id: 5,  name: 'DOTA 2',                short: 'D2', color: '#c23c3c' },
  { id: 6,  name: '博德之门3',             short: 'BG', color: '#8b5cf6' },
  { id: 7,  name: '黑神话：悟空',           short: 'BM', color: '#d4a017' },
  { id: 8,  name: '只狼：影逝二度',         short: 'SK', color: '#b84040' },
  { id: 9,  name: '荒野大镖客2',            short: 'RD', color: '#8b6914' },
  { id: 10, name: '文明6',                 short: 'C6', color: '#4a90d9' },
  { id: 11, name: '泰拉瑞亚',               short: 'TR', color: '#4caf50' },
  { id: 12, name: '星露谷物语',             short: 'SD', color: '#66bb6a' },
  { id: 13, name: '战神',                   short: 'GW', color: '#78909c' },
  { id: 14, name: '星空',                   short: 'SF', color: '#5c6bc0' },
  { id: 15, name: '地平线：零之曙光',        short: 'HZ', color: '#26a69a' }
];

var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

//  状态管理
// ============================================================
var currentPeriod = 'day';
var currentSort = 'time';
var selectedIndex = null;       // 周/月柱形图选中
var selectedGameId = null;      // 日维度环形图选中游戏
var selectedDate = new Date();  // 日/周维度选中的日期
var selectedYear = selectedDate.getFullYear();
var selectedMonth = selectedDate.getMonth(); // 月维度选中的年月
var panelYear = selectedDate.getFullYear();
var panelMonth = selectedDate.getMonth();    // 日历面板当前查看的年月

var mainChart = null;
var miniChart = null;

// ============================================================
//  工具函数
// ============================================================
function seededRandom(seed) {
  var x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function formatTime(hours) {
  if (hours <= 0) return '0 分钟';
  if (hours < 1) return Math.round(hours * 60) + ' 分钟';
  var h = Math.floor(hours);
  var m = Math.round((hours - h) * 60);
  if (m === 0) return h + ' 小时';
  if (m === 60) return (h + 1) + ' 小时';
  return h + ' 小时 ' + m + ' 分';
}

function formatTimeShort(hours) {
  if (hours === 0) return '0分';
  var sign = hours < 0 ? '-' : '';
  var abs = Math.abs(hours);
  if (abs < 1) return sign + Math.round(abs * 60) + '分';
  return sign + abs.toFixed(1) + '时';
}

function getGameById(id) {
  for (var i = 0; i < games.length; i++) {
    if (games[i].id === id) return games[i];
  }
  return null;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function isFuture(date) {
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var d = new Date(date);
  d.setHours(0, 0, 0, 0);
  return d > today;
}

function getMonday(date) {
  var d = new Date(date);
  var day = d.getDay();
  var diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function formatMD(date) {
  return (date.getMonth() + 1) + '/' + date.getDate();
}

function formatYMD(date) {
  return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日';
}

function formatYM(year, month) {
  return year + '年' + (month + 1) + '月';
}

function formatWeekRange(monday) {
  var sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);
  return formatMD(monday) + '-' + formatMD(sunday);
}

// ============================================================
//  数据层：基于日期动态生成
// ============================================================
function getGameDayData(gameId, date) {
  var gi = -1;
  for (var i = 0; i < games.length; i++) {
    if (games[i].id === gameId) { gi = i; break; }
  }
  var seed = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate() + (gi + 1) * 100000;
  var rand = seededRandom(seed);
  var isWeekend = date.getDay() === 0 || date.getDay() === 6;
  var base = isWeekend ? 1.3 : 0.65;
  if (rand < 0.15) return 0;
  return Math.round(base * rand * 3.5 * 100) / 100;
}

function getDayAllGames(date) {
  var result = {};
  games.forEach(function(g) { result[g.id] = getGameDayData(g.id, date); });
  return result;
}

function getDayTotal(date) {
  var sum = 0;
  games.forEach(function(g) { sum += getGameDayData(g.id, date); });
  return sum;
}

function getTodayGames() {
  return games.map(function(g) {
    return { id: g.id, name: g.name, short: g.short, color: g.color, total: getGameDayData(g.id, selectedDate) };
  }).filter(function(g) { return g.total > 0; })
    .sort(function(a, b) { return b.total - a.total; });
}

// 周维度：选中日所在周的7天
function getWeekDays() {
  var monday = getMonday(selectedDate);
  var days = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday);
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  return days;
}

function getWeekLabels() {
  return getWeekDays().map(function(d) {
    return formatMD(d) + ' ' + weekDayNames[d.getDay()];
  });
}

function getWeekTotals() {
  return getWeekDays().map(function(d) { return getDayTotal(d); });
}

function getWeekGameTotals(filterIndex) {
  var days = getWeekDays();
  return games.map(function(g) {
    var total;
    if (filterIndex !== null && filterIndex !== undefined) {
      total = getGameDayData(g.id, days[filterIndex]);
    } else {
      total = days.reduce(function(s, d) { return s + getGameDayData(g.id, d); }, 0);
    }
    return { id: g.id, name: g.name, short: g.short, color: g.color, total: total };
  }).filter(function(g) { return g.total > 0; });
}

// 月维度：选中月的各自然周
function getMonthWeeks() {
  var year = selectedYear;
  var month = selectedMonth;
  var firstDay = new Date(year, month, 1);
  var lastDay = new Date(year, month + 1, 0);
  var monday = getMonday(firstDay);
  var weeks = [];
  var weekNum = 1;
  while (monday <= lastDay) {
    var weekTotal = 0;
    var gameTotals = {};
    games.forEach(function(g) { gameTotals[g.id] = 0; });
    for (var i = 0; i < 7; i++) {
      var d = new Date(monday);
      d.setDate(d.getDate() + i);
      if (d.getMonth() === month && d.getFullYear() === year) {
        games.forEach(function(g) {
          var t = getGameDayData(g.id, d);
          gameTotals[g.id] += t;
          weekTotal += t;
        });
      }
    }
    weeks.push({ weekNum: weekNum, start: new Date(monday), total: weekTotal, gameTotals: gameTotals });
    monday.setDate(monday.getDate() + 7);
    weekNum++;
  }
  return weeks;
}

function getMonthLabels() {
  return getMonthWeeks().map(function(w) {
    return (selectedMonth + 1) + '月 第' + w.weekNum + '周';
  });
}

function getMonthTotals() {
  return getMonthWeeks().map(function(w) { return w.total; });
}

function getMonthGameTotals(filterIndex) {
  var weeks = getMonthWeeks();
  return games.map(function(g) {
    var total;
    if (filterIndex !== null && filterIndex !== undefined) {
      total = weeks[filterIndex].gameTotals[g.id] || 0;
    } else {
      total = weeks.reduce(function(s, w) { return s + (w.gameTotals[g.id] || 0); }, 0);
    }
    return { id: g.id, name: g.name, short: g.short, color: g.color, total: total };
  }).filter(function(g) { return g.total > 0; });
}

// 日维度右侧：近7日（以选中日为终点）
function getRecent7Days() {
  var days = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(selectedDate);
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  return days;
}

// ============================================================
//  日期选择器
// ============================================================
function updateDatePickerText() {
  var textEl = document.getElementById('datePickerText');
  if (currentPeriod === 'day') {
    textEl.textContent = formatYMD(selectedDate);
  } else if (currentPeriod === 'week') {
    textEl.textContent = formatWeekRange(getMonday(selectedDate));
  } else {
    textEl.textContent = formatYM(selectedYear, selectedMonth);
  }
}

function renderPickerPanel() {
  var panel = document.getElementById('pickerPanel');
  if (currentPeriod === 'month') {
    renderMonthPanel(panel);
  } else {
    renderCalendarPanel(panel);
  }
}

function renderCalendarPanel(panel) {
  var year = panelYear;
  var month = panelMonth;
  var firstDay = new Date(year, month, 1);
  var lastDay = new Date(year, month + 1, 0);
  var startMonday = getMonday(firstDay);
  var today = new Date();
  var selectedMonday = getMonday(selectedDate);

  var html = '<div class="cal-header">';
  html += '<button class="cal-nav-btn" id="calPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>';
  html += '<div class="cal-title">' + year + '年' + (month + 1) + '月</div>';
  html += '<button class="cal-nav-btn" id="calNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>';
  html += '</div>';

  html += '<div class="cal-weekdays">';
  ['一','二','三','四','五','六','日'].forEach(function(w) {
    html += '<div class="cal-weekday">' + w + '</div>';
  });
  html += '</div>';

  html += '<div class="cal-days">';
  var cursor = new Date(startMonday);
  for (var i = 0; i < 42; i++) {
    var isOtherMonth = cursor.getMonth() !== month;
    var isToday = isSameDay(cursor, today);
    var isSelected = isSameDay(cursor, selectedDate);
    var disabled = isFuture(cursor);
    var inSelectedWeek = false;
    if (currentPeriod === 'week') {
      var cursorMonday = getMonday(cursor);
      inSelectedWeek = cursorMonday.getTime() === selectedMonday.getTime();
    }

    var cls = 'cal-day';
    if (isOtherMonth) cls += ' other-month';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    if (disabled) cls += ' disabled';
    if (inSelectedWeek && !isSelected) cls += ' in-selected-week';

    html += '<div class="' + cls + '" data-date="' + cursor.getFullYear() + '-' + (cursor.getMonth()) + '-' + cursor.getDate() + '">' + cursor.getDate() + '</div>';
    cursor.setDate(cursor.getDate() + 1);
  }
  html += '</div>';

  html += '<div class="cal-footer"><button class="cal-today-btn" id="calToday">今天</button></div>';

  panel.innerHTML = html;

  // 事件绑定
  document.getElementById('calPrev').addEventListener('click', function(e) {
    e.stopPropagation();
    panelMonth--;
    if (panelMonth < 0) { panelMonth = 11; panelYear--; }
    renderCalendarPanel(panel);
  });

  document.getElementById('calNext').addEventListener('click', function(e) {
    e.stopPropagation();
    var nextMonth = panelMonth + 1;
    var nextYear = panelYear;
    if (nextMonth > 11) { nextMonth = 0; nextYear++; }
    // 不允许查看未来月份
    var now = new Date();
    if (nextYear > now.getFullYear() || (nextYear === now.getFullYear() && nextMonth > now.getMonth())) {
      return;
    }
    panelMonth = nextMonth;
    panelYear = nextYear;
    renderCalendarPanel(panel);
  });

  document.getElementById('calToday').addEventListener('click', function(e) {
    e.stopPropagation();
    selectedDate = new Date();
    panelYear = selectedDate.getFullYear();
    panelMonth = selectedDate.getMonth();
    closePicker();
    refreshAll();
  });

  // 日期点击 + 周维度整周悬浮
  var dayEls = panel.querySelectorAll('.cal-day');
  dayEls.forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      if (this.classList.contains('disabled')) return;
      var parts = this.dataset.date.split('-');
      selectedDate = new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
      closePicker();
      refreshAll();
    });

    if (currentPeriod === 'week') {
      el.addEventListener('mouseenter', function() {
        if (this.classList.contains('disabled')) return;
        var parts = this.dataset.date.split('-');
        var d = new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
        var hoverMonday = getMonday(d);
        dayEls.forEach(function(other) {
          var op = other.dataset.date.split('-');
          var od = new Date(parseInt(op[0]), parseInt(op[1]), parseInt(op[2]));
          if (getMonday(od).getTime() === hoverMonday.getTime() && !other.classList.contains('in-selected-week')) {
            other.classList.add('in-hover-week');
          }
        });
      });
      el.addEventListener('mouseleave', function() {
        dayEls.forEach(function(other) { other.classList.remove('in-hover-week'); });
      });
    }
  });
}

function renderMonthPanel(panel) {
  var year = panelYear;
  var now = new Date();

  var html = '<div class="cal-header">';
  html += '<button class="cal-nav-btn" id="calPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>';
  html += '<div class="cal-title">' + year + '年</div>';
  html += '<button class="cal-nav-btn" id="calNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>';
  html += '</div>';

  html += '<div class="month-grid">';
  for (var m = 0; m < 12; m++) {
    var isSelected = year === selectedYear && m === selectedMonth;
    var isCurrent = year === now.getFullYear() && m === now.getMonth();
    var isFuture = year > now.getFullYear() || (year === now.getFullYear() && m > now.getMonth());

    var cls = 'month-item';
    if (isSelected) cls += ' selected';
    else if (isCurrent) cls += ' current';
    if (isFuture) cls += ' disabled';

    html += '<button class="' + cls + '" data-month="' + m + '">' + monthNames[m] + '</button>';
  }
  html += '</div>';

  html += '<div class="cal-footer"><button class="cal-today-btn" id="calToday">本月</button></div>';

  panel.innerHTML = html;

  document.getElementById('calPrev').addEventListener('click', function(e) {
    e.stopPropagation();
    panelYear--;
    renderMonthPanel(panel);
  });

  document.getElementById('calNext').addEventListener('click', function(e) {
    e.stopPropagation();
    if (panelYear >= now.getFullYear()) return;
    panelYear++;
    renderMonthPanel(panel);
  });

  document.getElementById('calToday').addEventListener('click', function(e) {
    e.stopPropagation();
    selectedYear = now.getFullYear();
    selectedMonth = now.getMonth();
    panelYear = selectedYear;
    panelMonth = selectedMonth;
    closePicker();
    refreshAll();
  });

  panel.querySelectorAll('.month-item').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      if (this.classList.contains('disabled')) return;
      selectedMonth = parseInt(this.dataset.month);
      selectedYear = panelYear;
      closePicker();
      refreshAll();
    });
  });
}

function openPicker() {
  panelYear = currentPeriod === 'month' ? selectedYear : selectedDate.getFullYear();
  panelMonth = currentPeriod === 'month' ? selectedMonth : selectedDate.getMonth();
  renderPickerPanel();
  document.getElementById('pickerPanel').classList.add('open');
}

function closePicker() {
  document.getElementById('pickerPanel').classList.remove('open');
}

function renderTrendPanel() {

  var bodyEl = document.getElementById('sideBody');

  var title = selectedGame ? selectedGame.name + ' · 近7日趋势' : '近7日游玩趋势';

  }
  headerHtml += '</div>';

    dailyValues = recent7.map(function(d) { return getGameDayData(selectedGame.id, d); });
  } else {
    dailyValues = recent7.map(function(d) { return getDayTotal(d); });
  }

  var total7 = dailyValues.reduce(function(a, b) { return a + b; }, 0);
  var avg7 = total7 / 7;
  var maxVal = Math.max.apply(null, dailyValues);
  var maxIdx = dailyValues.indexOf(maxVal);
  var todayVal = dailyValues[6];

  var bodyHtml = '<div class="trend-panel">';
  bodyHtml += '<div id="miniChart"></div>';

  bodyHtml += '<div class="trend-summary">';
  bodyHtml += '<div class="summary-item"><div class="summary-label">7日总计</div><div class="summary-value">' + total7.toFixed(1) + ' 时</div></div>';
  bodyHtml += '<div class="summary-item"><div class="summary-label">日均</div><div class="summary-value">' + avg7.toFixed(1) + ' 时</div></div>';
  bodyHtml += '<div class="summary-item"><div class="summary-label">最高单日</div><div class="summary-value">' + formatMD(recent7[maxIdx]) + ' · ' + formatTimeShort(maxVal) + '</div></div>';
  bodyHtml += '<div class="summary-item"><div class="summary-label">活跃天数</div><div class="summary-value">' + dailyValues.filter(function(v) { return v > 0; }).length + ' / 7 天</div></div>';
  bodyHtml += '</div>';

  bodyHtml += '<div class="trend-list">';
  for (var i = 0; i <= 6; i++) {
    var label = recent7[i];
    var val = dailyValues[i];
    var barW = maxVal > 0 ? (val / maxVal * 100) : 0;
    var isToday = i === 6;

    var deltaClass = 'flat';
    var deltaText = '—';
    if (isToday) {
      deltaText = '当天';
    } else {
      var diff = val - todayVal;
      if (Math.abs(diff) < 0.05) {
        deltaText = '持平';
      } else if (diff > 0) {
        deltaClass = 'up';
        deltaText = '+' + formatTimeShort(diff);
      } else {
        deltaClass = 'down';
        deltaText = formatTimeShort(diff);
      }
    }

    bodyHtml += '<div class="trend-row' + (isToday ? ' today' : '') + '">';
    bodyHtml += '<div class="trend-date">' + formatMD(label) + '<span class="weekday">' + weekDayNames[label.getDay()] + '</span></div>';
    bodyHtml += '<div class="trend-bar-wrap"><div class="trend-bar" style="width:' + barW + '%;"></div></div>';
    bodyHtml += '<div class="trend-time">' + formatTimeShort(val) + '</div>';
    bodyHtml += '<div class="trend-delta ' + deltaClass + '">' + deltaText + '</div>';
    bodyHtml += '</div>';
  }
  bodyHtml += '</div></div>';

  bodyEl.innerHTML = bodyHtml;

  if (miniChart) { miniChart.dispose(); }
  miniChart = echarts.init(document.getElementById('miniChart'));
  new ResizeObserver(function() { if (miniChart) miniChart.resize(); }).observe(document.getElementById('miniChart'));

  var barColor = selectedGame ? selectedGame.color : '#66c0f4';
  var miniOption = {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'axis',
      confine: true,
      backgroundColor: '#16202d',
      borderColor: '#3c4d5e',
      textStyle: { color: '#c7d5e0', fontSize: 12 },
      formatter: function(params) {
        var idx = params[0].dataIndex;
        return formatMD(recent7[idx]) + ' ' + weekDayNames[recent7[idx].getDay()] + '<br/>' + formatTime(dailyValues[idx]);
      }
    },
    grid: { left: '2%', right: '2%', bottom: '8%', top: '10%', containLabel: true },
    xAxis: {
      type: 'category',
      data: recent7.map(function(d) { return formatMD(d); }),
      axisLine: { lineStyle: { color: '#3c4d5e' } },
      axisTick: { show: false },
      axisLabel: { color: '#6b7a8c', fontSize: 10 }
    },
    yAxis: {
      type: 'value',
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: { show: false },
      splitLine: { show: false }
    },
    series: [{
      type: 'bar',
      data: dailyValues.map(function(v, idx) {
        return {
          value: v,
          itemStyle: {
            color: idx === 6
              ? barColor
              : new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: barColor }, { offset: 1, color: '#2a475e' }]),
            borderRadius: [2, 2, 0, 0]
          }
        };
      }),
      barWidth: '50%'
    }]
  };
  miniChart.setOption(miniOption);

  if (selectedGame) {
    document.getElementById('backToOverview').addEventListener('click', function() {
      selectedGameId = null;
      renderMainChart();
      renderSidePanel();
    });
  }

  setTimeout(function() {
    var listEl = document.querySelector('.trend-list');
    if (listEl) { listEl.scrollTop = listEl.scrollHeight; }
  }, 60);
}

function renderRankPanel() {
  var headerEl = document.getElementById('sideHeader');
  var bodyEl = document.getElementById('sideBody');
  var labels = currentPeriod === 'week' ? getWeekLabels() : getMonthLabels();

  var headerHtml = '<div class="side-header-top">';
  headerHtml += '<div class="card-title">游戏时长排行</div>';
  headerHtml += '<div class="sort-toggle">';
  headerHtml += '<button class="sort-btn' + (currentSort === 'time' ? ' active' : '') + '" data-sort="time">按时长</button>';
  headerHtml += '<button class="sort-btn' + (currentSort === 'name' ? ' active' : '') + '" data-sort="name">按名称</button>';
  headerHtml += '</div></div>';
  if (selectedIndex !== null) {
    headerHtml += '<div class="filter-status"><span>已筛选：' + labels[selectedIndex] + '</span><span class="clear-filter" id="clearFilter">清除筛选</span></div>';
  }
  headerEl.innerHTML = headerHtml;

  var gameTotals = currentPeriod === 'week' ? getWeekGameTotals(selectedIndex) : getMonthGameTotals(selectedIndex);
  if (currentSort === 'time') {
    gameTotals.sort(function(a, b) { return b.total - a.total; });
  } else {
    gameTotals.sort(function(a, b) { return a.name.localeCompare(b.name, 'zh-CN'); });
  }

  if (gameTotals.length === 0) {
    bodyEl.innerHTML = '<div class="empty-state">该时段暂无游戏记录</div>';
    return;
  }

  var maxTotal = Math.max.apply(null, gameTotals.map(function(g) { return g.total; }));
  var grandTotal = gameTotals.reduce(function(s, g) { return s + g.total; }, 0);

  var html = '<div class="rank-list">';
  gameTotals.forEach(function(game, idx) {
    var percent = grandTotal > 0 ? (game.total / grandTotal * 100).toFixed(1) : '0.0';
    var barW = maxTotal > 0 ? (game.total / maxTotal * 100) : 0;
    html += '<div class="rank-item">';
    html += '<div class="rank-num' + (idx < 3 ? ' top-3' : '') + '">' + (idx + 1) + '</div>';
    html += '<div class="game-icon" style="background:' + game.color + ';">' + game.short + '</div>';
    html += '<div class="game-info">';
    html += '<div class="game-name">' + game.name + '</div>';
    html += '<div class="game-meta"><span class="game-time">' + formatTime(game.total) + '</span><span class="game-percent">' + percent + '%</span></div>';
    html += '</div>';
    html += '<div class="game-bar-wrap"><div class="game-bar" style="width:' + barW + '%;background:' + game.color + ';"></div></div>';
    html += '</div>';
  });
  html += '</div>';
  bodyEl.innerHTML = html;

  var sortBtns = headerEl.querySelectorAll('.sort-btn');
  sortBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      sortBtns.forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      currentSort = this.dataset.sort;
      renderRankPanel();
    });
  });

  var clearBtn = document.getElementById('clearFilter');
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      selectedIndex = null;
      renderMainChart();
      renderRankPanel();
    });
  }
}

// ============================================================
//  概览指标
// ============================================================
function updateStats() {
  if (currentPeriod === 'day') {
    var todayGames = getTodayGames();
    var totalTime = todayGames.reduce(function(s, g) { return s + g.total; }, 0);
    var topGame = todayGames[0] || null;
    var recent7 = getRecent7Days();
    var avg7 = recent7.reduce(function(s, d) { return s + getDayTotal(d); }, 0) / 7;

    document.getElementById('totalTime').innerHTML = totalTime.toFixed(1) + '<span class="unit">小时</span>';
    document.getElementById('totalTimeSub').textContent = formatYMD(selectedDate) + '累计游玩';
    document.getElementById('gameCount').innerHTML = todayGames.length + '<span class="unit">款</span>';
    document.getElementById('gameCountSub').textContent = formatMD(selectedDate) + '启动过的游戏';
    if (topGame) {
      document.getElementById('topGame').textContent = topGame.name;
      var topPct = totalTime > 0 ? (topGame.total / totalTime * 100).toFixed(1) : '0.0';
      document.getElementById('topGameTime').textContent = formatTime(topGame.total) + ' · 占比 ' + topPct + '%';
    } else {
      document.getElementById('topGame').textContent = '—';
      document.getElementById('topGameTime').textContent = '当日暂无游玩';
    }
    document.getElementById('avgTime').innerHTML = avg7.toFixed(1) + '<span class="unit">小时</span>';
    document.getElementById('avgTimeSub').textContent = '近7日日均时长';
  } else {
    var labels = currentPeriod === 'week' ? getWeekLabels() : getMonthLabels();
    var totals = currentPeriod === 'week' ? getWeekTotals() : getMonthTotals();
    var totalTime = totals.reduce(function(a, b) { return a + b; }, 0);
    var gameTotals = currentPeriod === 'week' ? getWeekGameTotals() : getMonthGameTotals();
    var topGame = gameTotals.sort(function(a, b) { return b.total - a.total; })[0];
    var avgTime = totals.length > 0 ? totalTime / totals.length : 0;

    var periodLabel = currentPeriod === 'week'
      ? formatWeekRange(getMonday(selectedDate))
      : formatYM(selectedYear, selectedMonth);

    document.getElementById('totalTime').innerHTML = totalTime.toFixed(1) + '<span class="unit">小时</span>';
    document.getElementById('totalTimeSub').textContent = periodLabel + '累计游玩';
    document.getElementById('gameCount').innerHTML = gameTotals.length + '<span class="unit">款</span>';
    document.getElementById('gameCountSub').textContent = periodLabel + '启动过的游戏';
    if (topGame) {
      document.getElementById('topGame').textContent = topGame.name;
      var topPct = totalTime > 0 ? (topGame.total / totalTime * 100).toFixed(1) : '0.0';
      document.getElementById('topGameTime').textContent = formatTime(topGame.total) + ' · 占比 ' + topPct + '%';
    }
    document.getElementById('avgTime').innerHTML = avgTime.toFixed(1) + '<span class="unit">小时</span>';
    document.getElementById('avgTimeSub').textContent = currentPeriod === 'week' ? '每日平均时长' : '每周平均时长';
  }
}

// ============================================================
//  全局刷新
// ============================================================
function refreshAll() {
  selectedIndex = null;
  selectedGameId = null;
  updateDatePickerText();
  updateStats();
  renderMainChart();
  renderSidePanel();
}

// ============================================================
//  事件绑定
// ============================================================
function bindEvents() {
  // 维度切换
  var tabs = document.querySelectorAll('.period-tab');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      currentPeriod = this.dataset.period;
      // 切到月维度时，用选中日期的年月
      if (currentPeriod === 'month') {
        selectedYear = selectedDate.getFullYear();
        selectedMonth = selectedDate.getMonth();
      }
      closePicker();
      refreshAll();
    });
  });

  // 日期选择器按钮
  document.getElementById('datePickerBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    var panel = document.getElementById('pickerPanel');
    if (panel.classList.contains('open')) {
      closePicker();
    } else {
      openPicker();
    }
  });

  // 点击外部关闭面板
  document.addEventListener('click', function(e) {
    var picker = document.getElementById('datePicker');
    if (!picker.contains(e.target)) {
      closePicker();
    }
  });
}

// ============================================================
//  初始化
// ============================================================
function init() {
  updateDatePickerText();
  updateStats();
  initMainChart();
  renderSidePanel();
  bindEvents();
}

init();
</script>
